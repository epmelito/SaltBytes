[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-ops"
version = "0.1.0"
description = "A configuration driven weather forecast snapshot pipeline."
readme = "readme.md"
requires-python = ">=3.11"
authors = [
    { name = "EJ Melito" }
]

[tool.setuptools.packages.find]
where = ["src"]