[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "forecast-ops"
version = "0.1.0"
description = "A configuration driven weather forecast snapshot pipeline."
readme = "readme.md"
requires-python = ">=3.11"
authors = [
    { name = "EJ Melito" }
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]