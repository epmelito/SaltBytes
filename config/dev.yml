environment: dev

locations:
  - id: prague
    name: Prague
    latitude: 50.0755
    longitude: 14.4378

  - id: ocracoke
    name: Ocracoke, NC
    latitude: 35.1262
    longitude: -75.9196

api:
  base_url: https://api.open-meteo.com/v1/forecast
  forecast_days: 2
  hourly_fields:
    - temperature_2m
    - precipitation_probability
    - wind_speed_10m

storage:
  raw_data_path: data/dev/raw
  database_path: data/dev/forecast_ops.duckdb

logging:
  level: DEBUG