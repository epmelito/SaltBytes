name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test and lint
    runs-on: ubuntu-latest

    steps:
      - name: check out repository
        uses: actions/checkout@v6

      - name: set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: install project
        run: python -m pip install --editable ".[dev]"

      - name: run tests
        run: python -m pytest

      - name: run lint checks
        run: python -m ruff check .