name: hosted ingestion and report publication

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: saltbytes-hosted-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_STORAGE_CONTAINER: saltbytes-state
      OBSERVABLE_TELEMETRY_DISABLE: "true"

    steps:
      - name: check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: install project
        run: python -m pip install --editable .

      - name: sign in to Azure with OpenID Connect
        uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: restore, ingest, and publish state
        run: bash scripts/hosted_ingestion.sh

      - name: sign out of Azure
        run: az logout

      - name: install dashboard dependencies
        working-directory: dashboard
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset AZURE_STORAGE_ACCOUNT AZURE_STORAGE_CONTAINER
          npm ci --no-audit --no-fund

      - name: generate published site
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset AZURE_STORAGE_ACCOUNT AZURE_STORAGE_CONTAINER
          rm -rf site dashboard/dist dashboard/src/data
          mkdir -p site/conditions site/operations
          saltbytes report conditions --format html --output site/conditions/index.html
          saltbytes report operations --format html --output site/operations/index.html
          saltbytes dashboard export --output dashboard/src/data
          npm --prefix dashboard run build
          mkdir -p site/dashboard
          cp -R dashboard/dist/. site/dashboard/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>SaltBytes</title>
            <style>
              :root {
                color: #152a33;
                background: #e8f1f2;
                font-family: Georgia, "Times New Roman", serif;
              }
              body {
                margin: 0;
                min-width: 960px;
                background:
                  linear-gradient(120deg, rgba(16, 89, 104, 0.13), transparent 42%),
                  #e8f1f2;
              }
              main {
                width: min(70rem, calc(100% - 8rem));
                margin: 0 auto;
                padding: 6rem 0 5rem;
              }
              .eyebrow,
              .destination-label {
                margin: 0 0 0.75rem;
                color: #0f5868;
                font-family: system-ui, sans-serif;
                font-size: 0.78rem;
                font-weight: 750;
                letter-spacing: 0.11em;
                text-transform: uppercase;
              }
              h1 {
                max-width: 14ch;
                margin: 0;
                font-size: clamp(3rem, 6vw, 5.6rem);
                line-height: 0.96;
              }
              .intro {
                max-width: 45rem;
                margin: 1.5rem 0 3.25rem;
                color: #38535c;
                font-family: system-ui, sans-serif;
                font-size: 1.2rem;
                line-height: 1.65;
              }
              nav {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 1.25rem;
              }
              .destination {
                display: block;
                min-height: 18rem;
                padding: 2rem;
                color: #152a33;
                text-decoration: none;
                background: rgba(255, 255, 255, 0.8);
                border: 1px solid #b9ced2;
                border-top: 0.45rem solid #0f5868;
                border-radius: 0.35rem;
                box-shadow: 0 1rem 2.5rem rgba(15, 58, 70, 0.08);
                transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
              }
              .destination:hover,
              .destination:focus-visible {
                border-color: #0f5868;
                box-shadow: 0 1.2rem 3rem rgba(15, 58, 70, 0.16);
                outline: 3px solid #0f5868;
                outline-offset: 4px;
                transform: translateY(-0.25rem);
              }
              .destination strong,
              .destination span {
                display: block;
              }
              .destination strong {
                max-width: 14ch;
                font-size: 2rem;
                line-height: 1.1;
              }
              .destination span {
                max-width: 32rem;
                margin-top: 1rem;
                color: #38535c;
                font-family: system-ui, sans-serif;
                line-height: 1.55;
              }
              .secondary {
                display: flex;
                gap: 1.25rem;
                margin-top: 2.5rem;
                color: #38535c;
                font-family: system-ui, sans-serif;
              }
              .secondary a {
                color: #0f5868;
                text-underline-offset: 0.2em;
              }
              a:focus-visible {
                outline: 3px solid #0f5868;
                outline-offset: 4px;
              }
            </style>
          </head>
          <body>
            <main>
              <p class="eyebrow">North Carolina shore forecasts</p>
              <h1>SaltBytes</h1>
              <p class="intro">SaltBytes brings upcoming coastal forecast conditions and the product health behind them into one clear public experience.</p>
              <nav aria-label="Primary reporting destinations">
                <a class="destination" href="dashboard/conditions">
                  <p class="destination-label">For anglers and coastal visitors</p>
                  <strong>Coastal conditions</strong>
                  <span>Explore upcoming wind, waves, sea surface temperature, tides, and available Spanish mackerel conditions at North Carolina shore locations.</span>
                </a>
                <a class="destination" href="dashboard/pipeline-monitoring">
                  <p class="destination-label">For product and technical review</p>
                  <strong>Operations and product health</strong>
                  <span>Review pipeline status, forecast revisions, and the provenance behind the published data.</span>
                </a>
              </nav>
              <p class="secondary">Static reports: <a href="conditions/">Conditions report</a><a href="operations/">Operations report</a></p>
            </main>
          </body>
          </html>
          HTML
          test -f site/index.html
          test -f site/conditions/index.html
          test -f site/operations/index.html
          test -f site/dashboard/index.html
          test -f site/dashboard/conditions.html
          test -f site/dashboard/forecast-revisions.html
          test -f site/dashboard/pipeline-monitoring.html
          test -f site/dashboard/data-provenance.html

      - name: upload published site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: ingest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: deploy published site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
