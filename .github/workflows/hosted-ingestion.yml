name: hosted ingestion and report publication

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: saltbytes-hosted-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_STORAGE_CONTAINER: saltbytes-state
      OBSERVABLE_TELEMETRY_DISABLE: "true"

    steps:
      - name: check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: install project
        run: python -m pip install --editable .

      - name: sign in to Azure with OpenID Connect
        uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: restore, ingest, and publish state
        run: bash scripts/hosted_ingestion.sh

      - name: sign out of Azure
        run: az logout

      - name: install dashboard dependencies
        working-directory: dashboard
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset AZURE_STORAGE_ACCOUNT AZURE_STORAGE_CONTAINER
          npm ci --no-audit --no-fund

      - name: generate published site
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          unset AZURE_STORAGE_ACCOUNT AZURE_STORAGE_CONTAINER
          rm -rf site dashboard/dist dashboard/src/data
          mkdir -p site/conditions site/operations
          saltbytes report conditions --format html --output site/conditions/index.html
          saltbytes report operations --format html --output site/operations/index.html
          saltbytes dashboard export --output dashboard/src/data
          npm --prefix dashboard run build
          mkdir -p site/dashboard
          cp -R dashboard/dist/. site/dashboard/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>SaltBytes</title>
            <style>
              body {
                margin: 0;
                font-family: system-ui, sans-serif;
                color: #17212b;
                background: #f4f7f8;
              }
              main {
                width: min(48rem, calc(100% - 2rem));
                margin: 4rem auto;
              }
              nav {
                display: grid;
                gap: 1rem;
                margin-top: 2rem;
              }
              a {
                display: block;
                padding: 1rem 1.25rem;
                color: inherit;
                text-decoration: none;
                background: white;
                border: 1px solid #d7e0e4;
                border-radius: 0.5rem;
              }
              a:hover,
              a:focus-visible {
                border-color: #276f83;
              }
              strong,
              span {
                display: block;
              }
              span {
                margin-top: 0.35rem;
                color: #52616b;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>SaltBytes</h1>
              <p>Explore upcoming North Carolina coastal conditions and the data pipeline behind them.</p>
              <nav aria-label="Published outputs">
                <a href="dashboard/">
                  <strong>Interactive dashboard</strong>
                  <span>Explore conditions, revisions, monitoring, and provenance.</span>
                </a>
                <a href="conditions/">
                  <strong>Conditions report</strong>
                  <span>Review the latest deterministic coastal forecast report.</span>
                </a>
                <a href="operations/">
                  <strong>Operations report</strong>
                  <span>Inspect pipeline status, coverage, revisions, and provenance.</span>
                </a>
              </nav>
            </main>
          </body>
          </html>
          HTML
          test -f site/index.html
          test -f site/conditions/index.html
          test -f site/operations/index.html
          test -f site/dashboard/index.html
          test -f site/dashboard/conditions.html
          test -f site/dashboard/forecast-revisions.html
          test -f site/dashboard/pipeline-monitoring.html
          test -f site/dashboard/data-provenance.html

      - name: upload published site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: ingest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: deploy published site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
