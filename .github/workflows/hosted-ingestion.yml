name: hosted ingestion and report publication

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: saltbytes-hosted-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      AZURE_STORAGE_CONTAINER: saltbytes-state

    steps:
      - name: check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: install project
        run: python -m pip install --editable .

      - name: sign in to Azure with OpenID Connect
        uses: Azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: restore, ingest, and publish state
        run: bash scripts/hosted_ingestion.sh

      - name: generate published site
        run: |
          mkdir -p site/conditions site/operations
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>SaltBytes reports</title>
          </head>
          <body>
            <main>
              <h1>SaltBytes reports</h1>
              <p>Upcoming coastal conditions and pipeline operations.</p>
              <ul>
                <li><a href="conditions/">Coastal conditions</a></li>
                <li><a href="operations/">Pipeline operations</a></li>
              </ul>
            </main>
          </body>
          </html>
          HTML
          saltbytes report conditions --format html --output site/conditions/index.html
          saltbytes report operations --format html --output site/operations/index.html

      - name: upload published site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: ingest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: deploy published site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
